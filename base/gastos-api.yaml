# Backend Spring Boot. Acessado apenas de dentro do cluster (o frontend encaminha /api).
apiVersion: v1
kind: Service
metadata:
  name: gastos-api
  labels:
    app.kubernetes.io/name: gastos-api
spec:
  selector:
    app.kubernetes.io/name: gastos-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gastos-api
  labels:
    app.kubernetes.io/name: gastos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gastos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gastos-api
    spec:
      automountServiceAccountToken: false
      # Aguarda o banco aceitar conexões antes de subir a API
      initContainers:
        - name: aguardar-banco
          image: postgres:18-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do echo 'aguardando banco...'; sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: gastos-api
          image: ghcr.io/fabioluisaf/gerenciador-gastos-api
          # Perfil do Spring e versão exibida pela API (definidos em cada overlay)
          envFrom:
            - configMapRef:
                name: gastos-api-config
          env:
            - name: PORTA_APP
              value: "8080"
            # -XX:-UseBASE64Intrinsics: mitigacao do Java4Shell (CVE-2026-114938)
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:-UseBASE64Intrinsics"
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: banco
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gerenciador-gastos-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gerenciador-gastos-db
                  key: DB_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 768Mi
              ephemeral-storage: 256Mi
