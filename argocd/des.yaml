apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gerenciador-gastos-des
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fabioluisaf/gerenciador-gastos-deploy.git
    targetRevision: main
    path: overlays/des
  destination:
    server: https://kubernetes.default.svc
    namespace: gerenciador-gastos-des
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
